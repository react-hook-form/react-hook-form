allowBuilds:
  '@swc/core': false
  esbuild: false
  unrs-resolver: false

# Dev-tooling-only transitive dependencies with known CVEs. None of these ship
# in the published package (dist/); pinned here to patched versions since the
# owning packages (bundlewatch, jest, eslint toolchain) haven't bumped them.
overrides:
  axios: '>=0.33.0'
  serialize-javascript: '>=7.0.5'
  js-yaml@3: '3.15.0'
  js-yaml@4: '4.3.0'
  fast-uri: '>=3.1.4'
  brace-expansion@1: '1.1.17'
  brace-expansion@2: '2.1.3'
  brace-expansion@5: '5.0.9'
